name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          VITE_SANITY_PROJECT_ID: ${{ vars.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET }}
          VITE_SANITY_API_VERSION: ${{ vars.VITE_SANITY_API_VERSION }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - run: npm install --global firebase-tools@14

      - name: Deploy preview channel
        if: github.event_name == 'pull_request'
        run: |
          firebase hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --expires 7d \
            --non-interactive

      - name: Deploy to production
        if: github.event_name == 'push'
        run: |
          firebase deploy --only hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive
